aid: humica
name: humi.ca
description: >-
  humi.ca is the Canadian HR, payroll, benefits, and hiring platform originally
  built as Humi and now operating as Employment Hero Canada (humi.ca redirects to
  employmenthero.com/en-ca). The platform is an all-in-one Employment Operating
  System covering HR management, payroll processing, applicant tracking (ATS),
  employee experience, learning, and Employer-of-Record hiring across 180+
  countries. Employment Hero exposes a public REST API at api.employmenthero.com,
  secured with OAuth 2.0 authorization-code plus PKCE (mandatory from 2026-09-14),
  with documented resources spanning employees, organisations, payroll, leave,
  timesheets, rostering, documents, and webhooks, plus a partner integration
  marketplace (Xero, QuickBooks, Slack, Google Workspace, Microsoft 365, Square,
  Indeed, LinkedIn and more).
